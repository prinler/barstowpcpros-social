<html><head><link rel="stylesheet" href="common.css"><style>
body{background:linear-gradient(180deg,#0d4f59 0%,#0a2a30 45%,#071a20 100%);color:#f5ead8;position:relative}
.sun{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#f36b32 0%,#f36b32 58%,rgba(243,107,50,.0) 59%);right:-150px;top:10px;opacity:.95}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(243,107,50,.28),rgba(243,107,50,0) 60%);right:-390px;top:-250px}
svg.ridge{position:absolute;left:0;bottom:0;width:1080px;height:520px}
.wrap{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:22px}
.top img{width:132px;height:auto;filter:drop-shadow(0 10px 22px rgba(0,0,0,.45))}
.top .mono{color:#80d5cb;font-size:22px;line-height:1.5}
h1{margin-top:96px;font-size:118px;line-height:.98;font-weight:800;letter-spacing:-.035em;max-width:760px}
h1 em{font-style:normal;color:#f36b32}
.sub{margin-top:34px;font-size:36px;line-height:1.35;color:#c3d2cf;max-width:720px;font-weight:500}
.chips{margin-top:52px;display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:900px}
.chip{background:rgba(245,234,216,.08);border:2px solid rgba(128,213,203,.35);border-radius:18px;padding:22px 26px;font-size:30px;font-weight:600;display:flex;align-items:center;gap:16px;backdrop-filter:blur(4px)}
.chip i{width:14px;height:14px;border-radius:50%;background:#80d5cb;flex:none}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.cta{background:#f36b32;color:#11191b;border-radius:999px;padding:26px 40px;font-size:40px;font-weight:800;letter-spacing:-.01em;box-shadow:0 18px 40px -14px rgba(0,0,0,.6)}
.cta small{display:block;font-size:20px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-bottom:4px}
.site{text-align:right;font-size:28px;font-weight:600;color:#f5ead8;line-height:1.4}
.site span{display:block;color:#80d5cb;font-size:22px}
</style></head><body>
<div class="glow"></div><div class="sun"></div>
<svg class="ridge" viewBox="0 0 1080 520" preserveAspectRatio="none">
<path d="M0 250 L190 140 L320 230 L450 120 L600 235 L720 170 L860 250 L1080 150 L1080 520 L0 520Z" fill="#07252b"/>
<path d="M0 330 L240 260 L420 330 L640 255 L860 330 L1080 280 L1080 520 L0 520Z" fill="#061419"/>
</svg>
<div class="wrap">
 <div class="top"><img src="../brand/logo.png"><div class="mono">Barstow &amp; the<br>High Desert</div></div>
 <h1>Tech help from someone <em>nearby.</em></h1>
 <div class="sub">Plain English. No judgment.<br>You know the cost before we start.</div>
 <div class="chips">
  <div class="chip"><i></i>Computers &amp; Wi-Fi</div>
  <div class="chip"><i></i>Security cameras</div>
  <div class="chip"><i></i>Websites that get calls</div>
  <div class="chip"><i></i>Practical AI for business</div>
 </div>
 <div class="foot">
  <div class="cta"><small>Call or text</small>(760) 282-4859</div>
  <div class="site">barstowpcpros.com<span>Remote first · We come to you</span></div>
 </div>
</div></body></html>
